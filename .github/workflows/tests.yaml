name: Tests
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Allow each job to check out the repo.
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version}}

      # 4. Synchronize dependencies using your lockfile
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run --python ${{ matrix.python-version}} flake8 src tests
          uv run --python ${{ matrix.python-version}} isort --check src tests
          uv run --python ${{ matrix.python-version}} python -m black --check --diff src tests
          uv run --python ${{ matrix.python-version}} mypy src tests

  unittest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version}}

      # 4. Synchronize dependencies using your lockfile
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Tests
        run: |
          uv run coverage run --source canonicaljson -m unittest
          uv run coverage report -m --fail-under 100

  packaging:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version}}

      # 4. Synchronize dependencies using your lockfile
      - name: Install dependencies
        run: uv sync --locked
      - name: Check manifest
        run: uv run check-manifest

  macos-tests:
    runs-on: macos-26
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version}}

      # 4. Synchronize dependencies using your lockfile
      - name: Install dependencies
        run: uv sync --locked
      - name: Run Tests on MacOS
        run: |
          uv run coverage run --source canonicaljson -m unittest
          uv run coverage report -m --fail-under 100
